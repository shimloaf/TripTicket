# ==============================================================================
#                      TripTicket - Configuration
# ==============================================================================

ticket:
  # Default duration of a trip ticket in seconds (3 minutes = 180 seconds)
  duration-seconds: 180

  # Seconds before the ticket expires to trigger the countdown warning (default: 10 seconds)
  warning-seconds: 10

  # List of seconds remaining at which to send warning countdown reminders
  countdown-seconds:
    - 10
    - 5
    - 4
    - 3
    - 2
    - 1

  # Time in seconds before an unaccepted invitation ticket expires (default: 60 seconds)
  invite-timeout-seconds: 60

  # Cooldown in seconds before a player can issue another ticket (0 to disable)
  cooldown-seconds: 0

  # Warmup delay in seconds before the guest embarks (0 to disable)
  warmup-seconds: 0
  cancel-warmup-on-move: true
  cancel-warmup-on-damage: true

  # Behavior if the visiting guest dies during their trip:
  # "cancel" - ends trip, guest respawns normally at their home/bed/spawn
  # "return" - guest respawns back at their original pre-trip location
  on-death: "cancel"

  # Return visiting guests to their original world if they disconnect
  return-on-disconnect: true

  # Safely return all active visiting guests home on server shutdown/reload
  return-on-shutdown: true

  # Check if return location is obstructed or hazardous and adjust safely
  safe-teleport-check: true

# ==============================================================================
# R.I.P. Anchor & Countdown Configuration (/ticket rip)
# ==============================================================================
rip:
  # Countdown in seconds before death occurs (default: 3 seconds)
  countdown-seconds: 3

  # Whether moving cancels the RIP countdown
  cancel-on-move: true

  # Whether taking damage cancels the RIP countdown
  cancel-on-damage: true

  # Sounds played during the RIP countdown and when tearing the ticket
  sounds:
    countdown: "ITEM_BOOK_PAGE_TURN"
    tear: "ENTITY_SHEEP_SHEAR"
    paper: "ITEM_BOOK_PAGE_TURN"

  # Designated anchor/hub location where players respawn after /ticket rip.
  # Can be updated in-game using /ticket setrip
  anchor:
    world: ""
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

# ==============================================================================
# Self-Trip (Random World Teleport) Configuration
# ==============================================================================
self-trip:
  # Whether issuing a ticket to yourself initiates a permanent one-way random trip
  enabled: true

  # Time in seconds before the confirmation prompt expires (default: 30 seconds)
  confirm-timeout-seconds: 30

  # Default coordinate radius (+/-) if not specified for an individual world
  default-range: 10000

  # Whitelist of allowed destination worlds for random teleportation.
  # Specify an optional custom coordinate range for each world.
  # If a range is omitted, default-range (10000) is used.
  allowed-worlds:
    world: 10000

# ==============================================================================
# Permissions Configuration
# ==============================================================================
# Configure access rules directly here without needing a permissions manager,
# or map custom permission nodes for plugins like LuckPerms.
permissions:
  # When true, ALL players can issue trip tickets for the default duration (3m).
  # When false, players strictly require the permission node configured below.
  # (Default: true)
  allow-everyone-default-duration: true

  # When true, only server Operators (Ops) or players with the custom duration
  # permission can specify custom trip lengths (e.g., /ticket Steve 10m).
  # Non-ops will automatically use the default duration.
  # (Default: true - Ops can request any length, regular players get default length)
  custom-duration-ops-only: true

  # When true, all players can accept incoming trip tickets (/ticket accept).
  # When false, requires the accept permission node.
  # (Default: true)
  allow-everyone-accept: true

  # When true, visiting guests can use /ticket return to return home early.
  # (Default: true)
  allow-everyone-return: true

  # When true, all players can check their remaining ticket time with /ticket remaining.
  # (Default: true)
  allow-everyone-check-time: true

  # When true, all players can use /ticket rip to perish and respawn at the anchor world.
  # (Default: true)
  allow-everyone-rip: true

  # Customizable permission nodes (compatible with LuckPerms and other permission plugins)
  nodes:
    invite: "tripticket.invite"
    accept: "tripticket.use"
    return: "tripticket.return"
    check-time: "tripticket.time"
    custom-duration: "tripticket.customduration"
    bypass-cooldown: "tripticket.cooldown.bypass"
    bypass-warmup: "tripticket.warmup.bypass"
    reload: "tripticket.reload"
    admin: "tripticket.admin"
    rip: "tripticket.rip"
    setrip: "tripticket.setrip"

visuals:
  # Show live remaining ticket time on the Action Bar
  show-actionbar: true

  # Display screen title/subtitle when the countdown warning fires
  show-title-on-warning: true

  # Sound effects (set to "NONE" to disable any sound)
  play-sounds: true
  sounds:
    embark: "ENTITY_BREEZE_SHOOT"
    warning: "BLOCK_NOTE_BLOCK_PLING"
    return: "ENTITY_BREEZE_IDLE_AIR"
    whisk: "ENTITY_BREEZE_SHOOT"

  # Particle effects (set to "NONE" to disable)
  play-particles: true
  particles:
    embark: "PORTAL"
    return: "REVERSE_PORTAL"

